name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# The workflow only reads the repository. It publishes nothing and needs no
# secrets: build and test validation must stay fully available on forks and
# without a paid Apple account.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify package and macOS app
    # macos-26 is the current stable hosted image. The only image carrying
    # Xcode 27 is a public preview, so CI pins the newest stable Xcode instead.
    # See docs/adr/0002-toolchain.md for what was actually tested where.
    runs-on: macos-26
    timeout-minutes: 30

    env:
      # Pinned, not floating. If this exact version stops existing on the image,
      # the job must fail loudly rather than silently testing something else.
      XCODE_APP: /Applications/Xcode_26.6.app

    steps:
      # actions/checkout v7.0.1, pinned to its immutable commit SHA.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Select the pinned Xcode toolchain
        run: |
          set -euo pipefail
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Pinned toolchain $XCODE_APP is not installed on this runner."
            echo "Available Xcode installations:"
            ls -1 /Applications | grep -i '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Verify
        # UI tests are skipped here for a specific, observed reason, not by
        # default caution: on 2026-09-23 the hosted macos-26 runner ran all 24
        # XCUITest cases, connected automation, and reported the app idle for
        # every one of them, but the element each test waited for never
        # appeared — including the most basic case, a static title on the
        # very first screen. Package tests and the Debug app-hosted unit
        # tests passed with zero failures in the same run. See
        # docs/adr/0002-toolchain.md.
        run: MACDEVCLEAN_SKIP_UI_TESTS=1 bash scripts/verify.sh

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcresult
          path: .build/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
